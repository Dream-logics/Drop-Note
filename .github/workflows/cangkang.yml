# Membangun APK cangkang Android.
#
# Ini satu-satunya tempat APK-nya pernah dikompilasi: lingkungan tempat
# kodenya ditulis tidak punya Android SDK sama sekali. Jadi CI yang jadi
# kompilatornya, dan hasilnya diunduh dari halaman Actions lalu dipasang tangan.
#
# Yang dibangun varian DEBUG, dan itu disengaja: debug ditandatangani kunci
# bawaan Android jadi APK-nya langsung bisa dipasang, sementara release yang
# tidak ditandatangani ditolak pemasangannya tanpa satu pesan yang berguna.
name: Cangkang

on:
  push:
    paths:
      - 'cangkang/**'
      - '.github/workflows/cangkang.yml'
  workflow_dispatch:      # tombol "Run workflow" kalau mau APK baru tanpa suntingan

permissions:
  contents: write      # menempelkan APK-nya ke rilis "cangkang"

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Bangun APK
        working-directory: cangkang
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cangkang-apk
          path: cangkang/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artefak Actions cuma bisa diunduh sesudah masuk akun, bentuknya zip,
      # dan alamatnya berganti tiap bangunan - tiga hambatan untuk sesuatu yang
      # dipasang dari HP. Rilis dengan tag TETAP memberi satu alamat yang tidak
      # pernah berubah, isinya APK apa adanya, dan bisa diketuk tanpa masuk
      # akun. Cuma dari main: APK dari cabang uji yang menimpa alamat yang sama
      # berarti yang dipasang belum tentu yang sudah digabung.
      - name: Tempel ke rilis tetap
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv cangkang/app/build/outputs/apk/debug/*.apk cangkang.apk
          gh release view cangkang >/dev/null 2>&1 \
            || gh release create cangkang --prerelease \
                 --title "Cangkang (terbaru)" \
                 --notes "APK terbaru dari main. Alamat berkasnya tetap, jadi tautan yang sama selalu memberi bangunan terakhir."
          gh release upload cangkang cangkang.apk --clobber
