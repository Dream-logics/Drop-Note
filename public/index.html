<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cortex Space</title>
<meta name="description" content="Satu kotak untuk menimbun catatan, satu pencarian untuk mengambilnya kembali.">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="gaya.css">
</head>
<body>

<!-- ===================== LAYAR MULAI (sekali saat dipasang) ===================== -->
<section class="layar" id="l-mulai">
  <header class="atas">
    <div class="merek" id="merek-mulai">Cortex Space</div>
  </header>
  <div class="gulung" id="mulai-isi"></div>
</section>

<!-- ===================== LAYAR UTAMA ===================== -->
<section class="layar aktif" id="l-utama">
  <header class="atas">
    <div class="merek" id="merek">Cortex Space</div>
    <div class="atas-kanan">
      <span class="jumlah" id="jumlah">0 tersimpan</span>
      <button class="ikon-btn" id="b-setelan" aria-label="Setelan">
        <svg viewBox="0 0 24 24" class="ik"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <!-- Tiga pintu, satu baris. Isinya digambar dari satu tempat di alur.js,
       bukan disalin tiga kali - baris yang disalin akan berbeda-beda begitu
       salah satunya disunting. -->
  <div class="tab-baris" data-tab></div>

  <!-- LACI DROP. Menempel di bawah pintu "Drop", karena di situlah semua cara
       MEMASUKKAN sesuatu berkumpul. Bawaannya teks - kotak di bawah sudah siap
       diketik tanpa memilih apa pun; laci ini cuma dibuka kalau yang mau masuk
       bukan teks. Dulu empat ikon ini berdiri permanen di atas kotak, memakan
       satu baris penuh sepanjang hari untuk sesuatu yang dipakai sekali-sekali. -->
  <div class="laci-drop sembunyi" id="panel-drop">
  <div class="lampiran" id="lampiran">
    <button class="lamp" data-lamp="gambar">
      <svg viewBox="0 0 24 24" class="ik"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Gambar</span>
    </button>
    <button class="lamp" data-lamp="berkas">
      <svg viewBox="0 0 24 24" class="ik"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Berkas</span>
    </button>
    <button class="lamp" data-lamp="suara">
      <svg viewBox="0 0 24 24" class="ik"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg><span>Suara</span>
    </button>
    <button class="lamp" data-lamp="daftar">
      <svg viewBox="0 0 24 24" class="ik"><rect x="3" y="4" width="7" height="7" rx="1.5"/><path d="M5 7.5l1.5 1.5L9 6"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/><path d="M4 15h5"/><path d="M4 19h5"/></svg><span>Daftar</span>
    </button>
  </div>
  </div>

  <!-- KOTAK DAN TOMBOLNYA MENEMPEL DI ATAS. Begitu hasil digambar di layar
       yang sama, daftarnya bisa ratusan baris - dan kendali yang ikut tergulir
       ke atas sama saja dengan tidak ada. Menempel berarti apa pun yang sedang
       kamu lihat, satu ketukan untuk menyaring atau menjatuhkan yang baru. -->
  <div class="kepala-tetap">
  <textarea id="kotak" class="kotak" rows="3" placeholder="Tempel atau tulis apa saja&#8230;" autocomplete="off" spellcheck="false"></textarea>

  <!-- Tombol menempel tepat di bawah kotak, bukan di dasar layar: di layar
       panjang, dasar layar itu jauh dari yang barusan diketik.

       TIDAK ADA TOMBOL "CATAT" DI SINI, DAN JANGAN DIKEMBALIKAN. Dulu ada, dan
       dia menagih satu pilihan yang tidak bisa dijawab: kamu belum tahu tulisanmu
       akan pendek atau panjang sebelum mengetiknya. Lebih buruk lagi, salah pilih
       tidak ada akibatnya - dua-duanya menyimpan hal yang sama dan sama-sama
       bisa disunting nanti. Pilihan yang salahnya tidak berakibat apa-apa itu
       pilihan palsu, dan pilihan palsu tetap menagih tenaga tanpa memberi apa pun.
       Layar tulisnya tetap ada; dia didatangi dari hasil pencarian, bukan
       diputuskan di depan.

       URUTANNYA DIBACA DARI KANAN, BUKAN DARI KIRI. Ini dipakai satu tangan
       sambil mengerjakan hal lain, dan jempol kanan bertumpu di sudut kanan
       bawah - makin ke kiri makin jauh diraih. Jadi yang paling sering ditekan
       duduk paling kanan, dan yang paling jarang dibuang ke ujung kiri.
       Membacanya seperti kalimat Inggris (kiri ke kanan) akan terasa rapi di
       layar laptop dan salah di tangan.

       TIDAK ADA TOMBOL "CARI", DAN TIDAK PERLU ADA. Kotak di atas ini SUDAH
       pencariannya: tiap huruf yang diketik langsung menyaring daftar di
       bawahnya. Tombol yang cuma memindahkan hal yang sama ke layar lain
       bukan jalan pintas, dia langkah tambahan. Sama seperti WhatsApp -
       ikon carinya adalah kotaknya itu sendiri. -->
  <div class="tombol-baris" id="tombol-utama">
    <button class="tbl" id="b-label" aria-haspopup="listbox" aria-expanded="false">
      <svg viewBox="0 0 24 24" class="ik"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg><span id="b-label-teks">Label</span>
      <svg viewBox="0 0 24 24" class="ik kecil"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <!-- Kembarannya tombol Gambar/Berkas di laci Drop, tapi arahnya terbalik:
         yang di atas MEMASUKKAN, yang ini MENGELUARKAN. Ikonnya sengaja dibuat
         sama supaya pasangannya kebaca tanpa dijelaskan. -->
    <button class="tbl" id="b-filter" aria-haspopup="listbox" aria-expanded="false">
      <svg viewBox="0 0 24 24" class="ik"><path d="M4 5h16"/><path d="M7 12h10"/><path d="M10 19h4"/></svg><span id="b-filter-teks">Jenis</span>
      <svg viewBox="0 0 24 24" class="ik kecil"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="tbl" id="b-drop">
      <svg viewBox="0 0 24 24" class="ik"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg>Drop
    </button>
  </div>
  </div>

  <!-- Laci jenis: sisi keluar dari laci Drop. Memilih "Gambar" di sini berarti
       "perlihatkan gambar-gambarku", tanpa satu kata pun diketik - dan itu
       pertanyaan yang tidak bisa dijawab kata kunci, karena gambar memang
       tidak punya kata. -->
  <div class="panel-label sembunyi" id="panel-filter">
    <div id="filter-daftar"></div>
  </div>

  <!-- Daftar label, terbuka dari tombol di atasnya. Kotak carinya muncul cuma
       kalau labelnya sudah banyak - di bawah itu dia mengambil tempat untuk
       menyaring sesuatu yang seluruhnya sudah kelihatan. -->
  <div class="panel-label sembunyi" id="panel-label">
    <input id="label-cari" class="label-cari sembunyi" placeholder="Cari label&#8230;" autocomplete="off" spellcheck="false">
    <div id="label-daftar"></div>
  </div>

  <!-- Yang dibaca otomatis dari isi kotak -->
  <div class="tebakan sembunyi" id="tebakan">
    <div class="tebakan-kepala">
      <svg viewBox="0 0 24 24" class="ik kilau"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
      <span id="tebakan-jenis">Terbaca</span>
    </div>
    <div class="tebakan-judul" id="tebakan-judul"></div>
    <div class="tebakan-ket" id="tebakan-ket"></div>
  </div>

  <!-- Daftar isi untuk jenis "daftar" -->
  <div class="sembunyi" id="petak-daftar">
    <div class="label-kecil">Daftar</div>
    <div id="daftar-baris"></div>
    <button class="tambah-baris" id="b-tambah-baris">+ baris</button>
  </div>

  <!-- HASIL DI LAYAR YANG SAMA. Ini tidak melanggar "layar depan kosong":
       yang dilarang adalah dinding kartu yang menyambut tanpa diminta. Kotak
       ini kosong sampai kamu sendiri memilih satu label, dan tertutup lagi
       lewat tanda silang di kepalanya. -->
  <div class="sembunyi" id="petak-hasil-depan">
    <div class="hasil-depan-kepala">
      <span id="hasil-depan-ket"></span>
      <button class="ikon-btn" id="b-tutup-hasil" aria-label="Tutup hasil">
        <svg viewBox="0 0 24 24" class="ik"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="hasil-depan"></div>
  </div>


  <!-- TIDAK ADA ISIAN KEYWORD DI SINI, DAN JANGAN DIKEMBALIKAN. Dulu ada:
       satu kotak "#" plus dua belas cip usulan. Dua alasan dia dibuang.

       Pertama, mencocokkan catatan dengan raknya itu pekerjaan berpikir, dan
       dia berdiri tepat di jalur masuk - tempat yang aturan nomor satu bilang
       harus benar-benar gratis. Hasilnya bukan dipakai sesekali; hasilnya
       tidak dipakai sama sekali.

       Kedua, usulannya sering salah konteks, dan itu bukan bug yang bisa
       ditambal di sini: mesin tanpa AI cuma bisa membandingkan EJAAN. Ejaan
       yang mirip tidak berarti maknanya berhubungan. Rak diisi AI sesudahnya,
       karena cuma dia yang membaca isinya - dan kalau AI mati, raknya kosong,
       dan itu keadaan yang sah. Pencarian tetap jalan di atas judul dan isi. -->

  <div class="tumbuh"></div>

  <div class="kaki" id="kaki-utama">Tersimpan langsung di perangkat, tanpa menunggu jaringan.</div>
</section>

<!-- ===================== LAYAR TUGAS (to-do) ===================== -->
<section class="layar" id="l-tugas">
  <header class="atas">
    <div class="merek" data-merek>Cortex Space</div>
    <span class="jumlah" id="tugas-ket"></span>
  </header>
  <div class="tab-baris" data-tab></div>

  <div class="cip-gulir" id="tugas-saring"></div>
  <!-- Daftar lahir dari keyword yang dipakai, bukan dari layar "buat daftar".
       Barisnya hilang sendiri kalau memang belum ada satu pun. -->
  <div class="cip-gulir" id="tugas-daftar-rak"></div>
  <div id="tugas-daftar"></div>
  <div class="tumbuh"></div>

  <!-- Satu isian, menempel di bawah. Menambah tugas harus semurah nge-drop:
       ketik, Enter, selesai - tanpa memilih daftar, tanpa mengisi tenggat. -->
  <div class="tugas-tambah jempol">
    <!-- Tenggat yang terbaca dari kalimatnya ditunjukkan SEBELUM disimpan.
         Tebakan yang tidak terlihat bikin alat terasa tidak bisa ditebak, dan
         alat yang tidak bisa ditebak akan ditinggalkan. -->
    <div class="tugas-tebak sembunyi" id="tugas-tebak"></div>
    <input id="tugas-baru" class="tugas-input" placeholder="Tambah tugas — tulis &#8220;besok&#8221;, &#8220;jumat&#8221;, &#8220;tgl 25&#8221;" autocomplete="off">
    <button class="tbl" id="b-tugas-tambah" aria-label="Tambah">
      <svg viewBox="0 0 24 24" class="ik"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </div>
</section>


<!-- ===================== LAYAR NOTE (berkas bertingkat) =====================
     Pengganti Notepad, tapi dipanggil dengan MENCARI, bukan dibuka dari pohon
     folder. Struktur foldernya tetap ada dan tetap kelihatan - itu yang bikin
     satu catatan punya alamat, bukan cuma mengambang di timbunan - tapi
     menyusuri folder satu per satu itu pekerjaan yang tidak perlu diadakan
     kalau kata kuncinya sudah ada di kepala.

     Alamatnya dari rak yang kamu pilih sendiri. Kalau lupa mengisi - dan itu
     yang biasanya terjadi - alamatnya diambil dari tag pertama buatan AI.
     Jadi tidak pernah ada catatan tanpa alamat. -->
<section class="layar" id="l-note">
  <header class="atas">
    <div class="merek" data-merek>Cortex Space</div>
    <span class="jumlah" id="note-jumlah"></span>
  </header>
  <div class="tab-baris" data-tab></div>

  <div class="kepala-tetap">
    <div class="note-alamat" id="note-alamat"></div>
    <input id="note-cari" class="cari-input" placeholder="Cari di semua folder&#8230;" autocomplete="off">
  </div>

  <div id="note-isi"></div>
  <div class="tumbuh"></div>
</section>

<!-- ===================== LAYAR CATAT (memo pad) ===================== -->
<section class="layar" id="l-catat">
  <header class="atas rapat">
    <button class="ikon-btn" data-kembali aria-label="Kembali">
      <svg viewBox="0 0 24 24" class="ik"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="simpan-tanda" id="simpan-tanda">tersimpan</div>
    <button class="ikon-btn" id="b-riwayat" aria-label="Riwayat">
      <svg viewBox="0 0 24 24" class="ik"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="ikon-btn" id="b-gembok" aria-label="Kunci catatan ini">
      <svg viewBox="0 0 24 24" class="ik"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </button>
    <button class="ikon-btn bahaya" id="b-buang" aria-label="Arsipkan">
      <svg viewBox="0 0 24 24" class="ik"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>
  </header>

  <input id="catat-judul" class="catat-judul" placeholder="Judul" autocomplete="off">
  <div class="kat-baris rapat">
    <span class="kat-pagar">#</span>
    <input id="catat-kat" class="kat-input" placeholder="kategori" autocomplete="off" spellcheck="false">
  </div>
  <div id="catat-lampiran"></div>
  <textarea id="catat-isi" class="catat-isi" placeholder="Tulis di sini. Boleh sepuluh kata hari ini, sepuluh lagi besok."></textarea>
  <div class="riwayat sembunyi" id="riwayat"></div>
</section>

<!-- ===================== LAYAR SETELAN ===================== -->
<section class="layar" id="l-setelan">
  <header class="atas rapat">
    <button class="ikon-btn" data-kembali aria-label="Kembali">
      <svg viewBox="0 0 24 24" class="ik"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="atas-judul">Setelan</div>
  </header>
  <div class="gulung" id="setelan-isi"></div>
</section>

<div class="pesan" id="pesan"></div>

<input type="file" id="pilih-gambar" accept="image/*" hidden>
<input type="file" id="pilih-berkas" hidden>

<script src="bawaan.js"></script>
<script src="simpan.js"></script>
<script src="otak.js"></script>
<script src="awan.js"></script>
<script src="kunci.js"></script>
<script src="tugas.js"></script>
<script src="pelabel.js"></script>
<script src="sinkron.js"></script>
<script src="alur.js"></script>
</body>
</html>
