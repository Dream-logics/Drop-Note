<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cortex Space</title>
<meta name="description" content="Satu kotak untuk menimbun catatan, satu pencarian untuk mengambilnya kembali.">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="gaya.css">
</head>
<body>

<!-- ===================== LAYAR MULAI (sekali saat dipasang) ===================== -->
<section class="layar" id="l-mulai">
  <header class="atas">
    <div class="merek" id="merek-mulai">Cortex Space</div>
  </header>
  <div class="gulung" id="mulai-isi"></div>
</section>

<!-- ===================== LAYAR UTAMA ===================== -->
<!-- dok-bawah PERMANEN. Dulu ini pilihan di Setelan, dan pilihannya
     dihapus: yang di atas terbukti kalah enak dipakai satu tangan, dan dua
     tata letak berarti tiap suntingan gaya harus diperiksa dua kali. -->
<section class="layar aktif dok-bawah" id="l-utama">
  <header class="atas">
    <div class="merek" id="merek">Cortex Space</div>
    <div class="atas-kanan">
      <!-- Reset TURUN LAGI ke baris saringan, di ujung kanan. Sempat naik ke
           sini untuk mengosongkan satu slot, dan itu keliru: kepala layar ada
           di ujung terjauh dari jempol yang bertumpu di sudut kanan bawah, dan
           tombol yang dipakai sepanjang hari tidak boleh minta tangan pindah
           posisi. Yang boleh tinggal di kepala cuma yang jarang disentuh.

           Angka "N tersimpan" tetap tidak kembali: dia tidak pernah mengubah
           satu keputusan pun. -->
      <button class="ikon-btn" id="b-setelan" aria-label="Setelan">
        <svg viewBox="0 0 24 24" class="ik"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <!-- Tiga pintu, satu baris. Isinya digambar dari satu tempat di alur.js,
       bukan disalin tiga kali - baris yang disalin akan berbeda-beda begitu
       salah satunya disunting. -->
  <div class="tab-baris" data-tab></div>

  <!-- SATU BLOK YANG MENEMPEL: kotak, tombolnya, dan ketiga lacinya.
       Posisinya bisa di ATAS atau di BAWAH layar, dipilih di Setelan. Di bawah
       itu bentuk yang paling enak diketik satu tangan - jempol tidak perlu
       menyeberang layar - dan itu sebabnya WhatsApp, Claude, dan hampir semua
       aplikasi yang dipakai berjam-jam menaruhnya di sana.

       Lacinya SELALU membuka ke bawah, di kedua posisi. Membuka ke atas
       berarti isi yang sedang dibaca melompat turun tepat saat kamu menekan
       sesuatu, dan tidak ada yang lebih bikin ragu daripada layar yang bergeser
       sendiri. -->
  <div class="dok" id="dok">
    <div class="kepala-tetap">
      <!-- Ala WhatsApp: dua ikon menempel di dalam kotaknya, tombol jatuhkan
           berdiri sendiri di kanan - paling dekat jempol. -->
      <div class="kotak-bar">
        <!-- IKON AI DI UJUNG KIRI KOTAK, tempat WhatsApp dan Telegram menaruh
             emoji. Bukan hiasan: dia mengubah arti seluruh kotak di sebelahnya
             - selama menyala, kotak ini berhenti mencari dan mulai bertanya -
             jadi dia berdiri di kepala kotaknya, seperti tanda kutip pembuka.

             Dia MENGHILANG begitu kamu mengetik di mode Drop, persis seperti
             kamera WhatsApp: empat ikon waktu diam, tiga waktu mengetik, dan
             yang pergi selalu yang paling tidak mungkin dipakai saat itu -
             orang yang sudah mengetik catatan tidak sedang mau bertanya. -->
        <button class="tbl" id="b-ai" aria-pressed="false" aria-label="Mode AI">
          <svg viewBox="0 0 24 24" class="ik"><path d="M11 3l1.6 4.4L17 9l-4.4 1.6L11 15l-1.6-4.4L5 9l4.4-1.6z"/><path d="M17.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        </button>
        <!-- Teks bayangan digambar di lapisan DI BELAKANG kotaknya, bukan di
             dalam textarea - textarea tidak bisa berisi dua warna. Lapisannya
             memakai huruf, jarak, dan lebar yang sama persis, lalu kotaknya
             dibuat bening di atasnya. Yang tersalin waktu kamu menyalin tetap
             cuma yang kamu ketik. -->
        <div class="kotak-bungkus">
          <div class="kotak-bayang" id="kotak-bayang" aria-hidden="true"></div>
          <textarea id="kotak" class="kotak" rows="1" placeholder="Tulis atau cari&#8230;" autocomplete="off" spellcheck="false"></textarea>
          <!-- Panah penerima. Dia satu-satunya bagian bayangan yang duduk DI
               ATAS kotak teksnya - ekornya sendiri ada di belakang dan tidak
               akan pernah bisa disentuh. Letaknya dihitung dari ujung ekor
               tiap kali bayangannya digambar ulang. -->
          <button class="terima-ekor sembunyi" id="b-terima" type="button" aria-label="Terima tebakan">
            <i><svg viewBox="0 0 24 24" class="ik"><path d="M9 6l6 6-6 6"/></svg></i>
          </button>
        </div>
        <!-- URUTAN DI UJUNG KANAN: klip - Todo - Drop. Ketiganya tindakan,
             dan ketiganya duduk di jangkauan jempol kanan. Yang paling sering
             ditekan paling kanan; corong saringan pindah jadi cip di atas
             kotak, jadi tempatnya di sini bebas untuk yang benar-benar
             dipakai. -->
        <button class="tbl" id="b-lampir" aria-haspopup="listbox" aria-expanded="false" aria-label="Lampiran">
          <svg viewBox="0 0 24 24" class="ik"><path d="M21 11.5l-8.8 8.8a5 5 0 0 1-7.1-7.1l8.8-8.8a3.4 3.4 0 0 1 4.8 4.8l-8.8 8.8a1.7 1.7 0 0 1-2.4-2.4l8.1-8.1"/></svg>
        </button>
        <!-- Papan bercentang: bentuk yang dikenali sebagai "daftar tugas" di
             mana-mana, dan bukan centang telanjang - centang saja berarti
             "selesai", padahal yang dilakukan tombol ini justru MEMBUAT. -->
        <button class="tbl" id="b-tugas" aria-label="Jadikan tugas">
          <svg viewBox="0 0 24 24" class="ik"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 13l2 2 4-4"/></svg>
        </button>
      </div>
      <!-- Kabar ke mana barangnya akan mendarat, plus turunan gudangnya.
           Tidak perlu disentuh sama sekali - mengetuknya cuma jalan pintas
           untuk saat kata berikutnya tidak langsung terpikir. -->
      <div class="ruang-baris sembunyi" id="ruang-baris"></div>
      <!-- Saringan jenis, naik dari dalam laci ke atas kotaknya. Di dalam laci
           dia butuh dua ketukan untuk sesuatu yang dipakai tiap hari, dan
           ketukan pertamanya cuma untuk melihat pilihan yang seharusnya sudah
           kelihatan. Cip Todo ikut di sini, dipatok di ujung KANAN - tepat di
           atas tombol Drop, tempat jempol kanan sudah bertumpu. -->
      <!-- SATU BARIS, TIDAK BOLEH MELIPAT. Saringan yang melipat jadi dua
           baris mendorong doknya naik, dan tinggi dok yang berubah-ubah
           sambil kamu mengetik adalah layar yang bergoyang di bawah jempol.
           Jadi saringannya ikon telanjang dengan angka menumpang DI ATAS
           ikonnya, bukan di sebelahnya - dan ikon AI menumpang di ujung kanan
           baris yang sama, tetap tepat di atas tombol Drop. -->
      <div class="saring-baris" id="saring-baris">
        <div class="saring-cip-baris" id="saring-cip"></div>
      </div>
      <button class="tbl" id="b-drop">
        <svg viewBox="0 0 24 24" class="ik turun"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg>
        <!-- Panah kirim cuma terlihat di mode AI. Ikon yang tidak berubah
             padahal tombolnya berubah arti adalah cara tercepat membuat orang
             menekan sesuatu yang tidak dia maksud. -->
        <svg viewBox="0 0 24 24" class="ik kirim"><path d="M4 12l16-8-6 16-2.6-6.6z"/></svg>
        <span>Drop</span>
      </button>
    </div>

    <!-- LACI DROP: semua cara MEMASUKKAN sesuatu. Bawaannya teks - kotak di
         atas sudah siap diketik tanpa memilih apa pun; laci ini cuma dibuka
         kalau yang mau masuk bukan teks. -->
    <div class="laci sembunyi" id="panel-drop">
    <div class="lampiran" id="lampiran">
    <button class="lamp" data-lamp="gambar">
      <i><svg viewBox="0 0 24 24" class="ik"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></i><span>Gambar</span>
    </button>
    <button class="lamp" data-lamp="berkas">
      <i><svg viewBox="0 0 24 24" class="ik"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></i><span>Berkas</span>
    </button>
    <button class="lamp" data-lamp="kamera">
      <i><svg viewBox="0 0 24 24" class="ik"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></i><span>Kamera</span>
    </button>
    <button class="lamp" data-lamp="link">
      <i><svg viewBox="0 0 24 24" class="ik"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></i><span>Link</span>
    </button>
    <button class="lamp" data-lamp="daftar">
      <i><svg viewBox="0 0 24 24" class="ik"><rect x="3" y="4" width="7" height="7" rx="1.5"/><path d="M5 7.5l1.5 1.5L9 6"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/><path d="M4 15h5"/><path d="M4 19h5"/></svg></i><span>Daftar</span>
    </button>
    </div>
    </div>

    <!-- Laci jenis, SENGAJA KOSONG untuk sekarang. Isinya - saringan gambar,
         berkas, link - sudah naik jadi cip di atas kotaknya, dan tempat ini
         menunggu isian berikutnya. -->
    <div class="laci sembunyi" id="panel-filter">
      <div id="filter-daftar"></div>
    </div>
  </div>

  <!-- Yang dibaca otomatis dari isi kotak -->
  <div class="tebakan sembunyi" id="tebakan">
    <div class="tebakan-kepala">
      <svg viewBox="0 0 24 24" class="ik kilau"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
      <span id="tebakan-jenis">Terbaca</span>
    </div>
    <div class="tebakan-judul" id="tebakan-judul"></div>
    <div class="tebakan-ket" id="tebakan-ket"></div>
  </div>

  <!-- KOTAK KHUSUS LINK. Menempel sepuluh tautan sekaligus lalu harus
       menyorot satu per satu dengan jempol untuk menyalinnya adalah pekerjaan
       yang justru mau dihapus - dan itu dikerjakan tepat waktu kamu paling
       buru-buru. Di sini ditempel sekali, dipisah sendiri, dan tiap satunya
       punya tombol salinnya masing-masing di kartunya nanti. -->
  <div class="sembunyi" id="petak-link">
    <div class="label-kecil">Tempel link</div>
    <textarea id="link-tempel" class="kotak tinggi" rows="4" placeholder="Tempel apa saja &#8212; yang berbentuk alamat akan dipisah sendiri" autocomplete="off" spellcheck="false"></textarea>
    <div class="link-ket" id="link-ket"></div>
  </div>

  <!-- Daftar isi untuk jenis "daftar" -->
  <div class="sembunyi" id="petak-daftar">
    <div class="label-kecil">Daftar</div>
    <div id="daftar-baris"></div>
    <button class="tambah-baris" id="b-tambah-baris">+ baris</button>
  </div>

  <!-- HASIL DI LAYAR YANG SAMA. Ini tidak melanggar "layar depan kosong":
       yang dilarang adalah dinding kartu yang menyambut tanpa diminta. Kotak
       ini kosong sampai kamu sendiri memilih satu label, dan tertutup lagi
       lewat tanda silang di kepalanya. -->
  <div class="sembunyi" id="petak-hasil-depan">
    <div class="hasil-depan-kepala">
      <span id="hasil-depan-ket"></span>
      <!-- Cuma muncul kalau yang tampil gambar. Untuk jenis lain, ukuran
           thumbnail tidak menjawab pertanyaan apa pun - yang dikenali di sana
           judulnya, dan judul tidak punya ukuran. -->
      <span class="tampil-baris sembunyi" id="tampil-baris"></span>
      <button class="ikon-btn" id="b-tutup-hasil" aria-label="Tutup hasil">
        <svg viewBox="0 0 24 24" class="ik"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="hasil-depan"></div>
  </div>

  <!-- MODE AI. Ini satu-satunya tempat di seluruh aplikasi tempat kamu
       MENUNGGU AI. Di semua tempat lain dia bekerja di belakang dan boleh
       gagal diam-diam; di sini dia yang diajak bicara, jadi dia punya modenya
       sendiri - dan modenya menutup hasil pencarian, bukan berdampingan
       dengannya. Dua daftar yang berebut layar yang sama membuat keduanya
       tidak terbaca.

       Ini juga tidak melanggar "layar depan kosong": petak ini tertutup sampai
       kamu sendiri yang menyalakan ikonnya. -->
  <div class="sembunyi" id="petak-ai">
    <div class="ai-kepala">
      <div class="ai-mode" id="ai-mode"></div>
      <button class="ikon-btn" id="b-ai-bersih" aria-label="Kosongkan obrolan">
        <svg viewBox="0 0 24 24" class="ik"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
    <div id="ai-isi"></div>
  </div>


  <!-- TIDAK ADA ISIAN KEYWORD DI SINI, DAN JANGAN DIKEMBALIKAN. Dulu ada:
       satu kotak "#" plus dua belas cip usulan. Dua alasan dia dibuang.

       Pertama, mencocokkan catatan dengan raknya itu pekerjaan berpikir, dan
       dia berdiri tepat di jalur masuk - tempat yang aturan nomor satu bilang
       harus benar-benar gratis. Hasilnya bukan dipakai sesekali; hasilnya
       tidak dipakai sama sekali.

       Kedua, usulannya sering salah konteks, dan itu bukan bug yang bisa
       ditambal di sini: mesin tanpa AI cuma bisa membandingkan EJAAN. Ejaan
       yang mirip tidak berarti maknanya berhubungan. Rak diisi AI sesudahnya,
       karena cuma dia yang membaca isinya - dan kalau AI mati, raknya kosong,
       dan itu keadaan yang sah. Pencarian tetap jalan di atas judul dan isi. -->

  <div class="tumbuh"></div>

  <div class="kaki" id="kaki-utama">Tersimpan langsung di perangkat, tanpa menunggu jaringan.</div>
</section>

<!-- ===================== LAYAR TUGAS (to-do) ===================== -->
<section class="layar" id="l-tugas">
  <header class="atas">
    <div class="merek" data-merek>Cortex Space</div>
    <span class="jumlah" id="tugas-ket"></span>
  </header>
  <div class="tab-baris" data-tab></div>

  <div class="cip-gulir" id="tugas-saring"></div>
  <!-- Daftar lahir dari keyword yang dipakai, bukan dari layar "buat daftar".
       Barisnya hilang sendiri kalau memang belum ada satu pun. -->
  <div class="cip-gulir" id="tugas-daftar-rak"></div>
  <div id="tugas-daftar"></div>
  <div class="tumbuh"></div>

  <!-- Satu isian, menempel di bawah. Menambah tugas harus semurah nge-drop:
       ketik, Enter, selesai - tanpa memilih daftar, tanpa mengisi tenggat. -->
  <div class="tugas-tambah jempol">
    <!-- Tenggat yang terbaca dari kalimatnya ditunjukkan SEBELUM disimpan.
         Tebakan yang tidak terlihat bikin alat terasa tidak bisa ditebak, dan
         alat yang tidak bisa ditebak akan ditinggalkan. -->
    <div class="tugas-tebak sembunyi" id="tugas-tebak"></div>
    <input id="tugas-baru" class="tugas-input" placeholder="Tambah tugas — tulis &#8220;besok&#8221;, &#8220;jumat&#8221;, &#8220;tgl 25&#8221;" autocomplete="off">
    <button class="tbl" id="b-tugas-tambah" aria-label="Tambah">
      <svg viewBox="0 0 24 24" class="ik"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </div>
</section>


<!-- ===================== LAYAR NOTE (berkas bertingkat) =====================
     Pengganti Notepad, tapi dipanggil dengan MENCARI, bukan dibuka dari pohon
     folder. Struktur foldernya tetap ada dan tetap kelihatan - itu yang bikin
     satu catatan punya alamat, bukan cuma mengambang di timbunan - tapi
     menyusuri folder satu per satu itu pekerjaan yang tidak perlu diadakan
     kalau kata kuncinya sudah ada di kepala.

     Alamatnya dari rak yang kamu pilih sendiri. Kalau lupa mengisi - dan itu
     yang biasanya terjadi - alamatnya diambil dari tag pertama buatan AI.
     Jadi tidak pernah ada catatan tanpa alamat. -->
<section class="layar" id="l-note">
  <header class="atas">
    <div class="merek" data-merek>Cortex Space</div>
    <span class="jumlah" id="note-jumlah"></span>
  </header>
  <div class="tab-baris" data-tab></div>

  <!-- Kepalanya sendiri, BUKAN .kepala-tetap milik layar Drop: yang di sana
       grid tiga kolom untuk tiga tombol, dan di sini isinya cuma dua - jadi
       kotak Cari-nya terjepit di sepertiga lebar layar dan tulisannya
       terpenggal. Di sini jejak folder sebaris penuh, kotak Cari sebaris
       penuh di bawahnya. -->
  <div class="note-kepala">
    <div class="note-alamat" id="note-alamat"></div>
    <!-- Menahan kartu tetap jalan, tapi TIDAK BOLEH jadi satu-satunya jalan:
         gerakan yang tidak kelihatan sama dengan tidak ada bagi orang yang
         belum pernah diberi tahu. Jadi ada tombolnya, dan tombol itu kecil dan
         redup - dia pintu ke pekerjaan sebulan sekali. -->
    <div class="note-cari-baris">
      <input id="note-cari" class="cari-input" placeholder="Cari di semua folder&#8230;" autocomplete="off">
      <button class="pilih-mulai" id="b-pilih-mulai">Pilih</button>
    </div>
    <!-- BILAH PILIH. Cuma muncul kalau ada yang dipilih - sebuah bilah yang
         menganga kosong sepanjang hari untuk pekerjaan yang dilakukan sebulan
         sekali adalah tempat yang dirampas dari isinya sendiri. -->
    <div class="pilih-bilah sembunyi" id="pilih-bilah">
      <span id="pilih-jumlah">0 dipilih</span>
      <button class="pilih-tbl" id="b-pilih-gabung">Gabung</button>
      <button class="pilih-tbl bahaya" id="b-pilih-buang">Buang</button>
      <button class="pilih-tbl" id="b-pilih-batal">Batal</button>
    </div>
  </div>

  <div id="note-isi"></div>
  <div class="tumbuh"></div>
</section>

<!-- ===================== LAYAR CATAT (memo pad) ===================== -->
<!-- LAYAR NOTE: RUANG MENULIS, bukan hasil saringan Drop.
     Ini pintu keempat, dan dia ada karena satu penemuan: menulis panjang -
     brief, instruksi, rancangan - itu pekerjaan dua puluh menit yang ditinggal
     lalu didatangi lagi, sama sekali bukan pekerjaan tiga detik yang dilayani
     kotak Drop. Selama ini pekerjaan itu lari ke Notepad dan ke chat WhatsApp
     ke diri sendiri, dan dari sana tidak pernah kembali.

     Pencariannya berdiri sendiri di sini, dan itu yang paling penting: mencari
     tulisan di antara ribuan potongan drop berarti mengayak yang kamu tahu
     persis ada. Di layar ini yang dicari cuma tulisan. -->
<section class="layar" id="l-tulis">
  <header class="atas">
    <div class="merek" data-merek>Cortex Space</div>
    <div class="atas-kanan">
      <button class="ikon-btn" data-ke-setelan aria-label="Setelan">
        <svg viewBox="0 0 24 24" class="ik"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="tab-baris" data-tab></div>

  <input id="tulis-cari" class="cari-input" placeholder="Cari di catatanmu&#8230;" autocomplete="off">
  <div id="tulis-isi"></div>
  <div class="tumbuh"></div>

  <!-- Bulat, beralas aksen, di sudut kanan bawah - bentuk dan tempat yang
       sama persis dengan tombol Drop, karena artinya sama: inilah tindakan
       layar ini. Jempol kanan sudah bertumpu di situ. -->
  <button class="tulis-baru" id="b-tulis-baru" aria-label="Tulis catatan baru">
    <svg viewBox="0 0 24 24" class="ik"><path d="M4 20h16"/><path d="M14.5 4.5l5 5L8 21H3v-5z"/></svg>
  </button>
</section>

<section class="layar" id="l-catat">
  <header class="atas rapat">
    <button class="ikon-btn" data-kembali aria-label="Kembali">
      <svg viewBox="0 0 24 24" class="ik"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="simpan-tanda" id="simpan-tanda">tersimpan</div>
    <button class="ikon-btn" id="b-riwayat" aria-label="Riwayat" title="Riwayat">
      <svg viewBox="0 0 24 24" class="ik"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="ikon-btn" id="b-gembok" aria-label="Kunci catatan ini">
      <svg viewBox="0 0 24 24" class="ik"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </button>
    <button class="ikon-btn bahaya" id="b-buang" aria-label="Arsipkan">
      <svg viewBox="0 0 24 24" class="ik"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>
  </header>

  <input id="catat-judul" class="catat-judul" placeholder="Judul" autocomplete="off">
  <div class="kat-baris rapat">
    <span class="kat-pagar">#</span>
    <!-- datalist, bukan select: gudangnya ditawarkan, tapi kolomnya tetap
         bisa diketik bebas. Barang yang mendarat di gudang yang salah
         dipindah dari sini - satu kolom, tanpa layar tambahan. -->
    <input id="catat-kat" class="kat-input" placeholder="kategori" autocomplete="off"
           spellcheck="false" list="daftar-gudang">
    <datalist id="daftar-gudang"></datalist>
  </div>
  <div id="catat-lampiran"></div>
  <textarea id="catat-isi" class="catat-isi" placeholder="Tulis di sini. Boleh sepuluh kata hari ini, sepuluh lagi besok."></textarea>
  <div class="riwayat sembunyi" id="riwayat"></div>

  <!-- TOMBOL SIMPAN, DI BAWAH, DAN JANGAN DIHILANGKAN LAGI.
       Layar ini menyimpan sendiri tiap kali kamu berhenti mengetik, dan
       secara teknis tombol ini tidak menambah apa-apa. Tapi yang menahan
       orang menulis dua puluh menit di sini bukan kehilangan yang pernah
       terjadi - melainkan tidak adanya satu pun bukti bahwa tulisannya aman.
       Tombolnya membayar keraguan itu, dan itu alasan yang cukup.

       Di bawah, bukan di kepala: tangan sedang di papan ketik, dan sudut
       kanan bawah tempat jempol sudah bertumpu. -->
  <div class="catat-dok">
    <button class="tbl simpan" id="b-simpan">
      <svg viewBox="0 0 24 24" class="ik"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg><span>Simpan</span>
    </button>
  </div>
</section>

<!-- ===================== LAYAR SETELAN ===================== -->
<section class="layar" id="l-setelan">
  <header class="atas rapat">
    <button class="ikon-btn" data-kembali aria-label="Kembali">
      <svg viewBox="0 0 24 24" class="ik"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="atas-judul">Setelan</div>
  </header>
  <div class="gulung" id="setelan-isi"></div>
</section>

<!-- Pratinjau gambar. Menyentuh sebuah gambar hampir selalu berarti "aku mau
     LIHAT ini", bukan "aku mau menyuntingnya" - dan petak kecil memang terlalu
     kecil untuk menjawabnya. Menutupnya cukup dengan menyentuh di mana saja:
     satu tombol silang di layar penuh yang cuma berisi satu gambar adalah
     sasaran yang harus dicari untuk sesuatu yang sudah jelas. -->
<div class="lihat sembunyi" id="lihat">
  <img id="lihat-isi" alt="">
</div>

<!-- SATU-SATUNYA DIALOG KONFIRMASI DI APLIKASI INI, dan itu disengaja.
     Jalur masuk tidak pernah bertanya apa pun - bertanya di sana membunuh
     kebiasaannya. Tapi membuang dua puluh catatan sekaligus itu satu-satunya
     tindakan yang tidak bisa diurungkan dengan satu ketukan, dan yang seperti
     itu pantas ditahan sekali. -->
<div class="tanya sembunyi" id="tanya">
  <div class="tanya-kotak">
    <div class="tanya-judul" id="tanya-judul"></div>
    <div class="tanya-ket" id="tanya-ket"></div>
    <div class="tanya-aksi">
      <button class="set-tbl" id="b-tanya-batal">Batal</button>
      <button class="set-tbl emas" id="b-tanya-ya">Lanjut</button>
    </div>
  </div>
</div>

<div class="pesan" id="pesan"></div>

<input type="file" id="pilih-gambar" accept="image/*" hidden>
<!-- capture="environment" menyuruh HP membuka kamera belakang langsung, bukan
     galeri. Sesudah itu jalurnya sama persis dengan Gambar: dikecilkan,
     disimpan lokal, dicadangkan ke Drive belakangan. -->
<input type="file" id="pilih-kamera" accept="image/*" capture="environment" hidden>
<input type="file" id="pilih-berkas" hidden>

<script src="bawaan.js"></script>
<script src="simpan.js"></script>
<script src="otak.js"></script>
<script src="awan.js"></script>
<script src="kunci.js"></script>
<script src="tugas.js"></script>
<script src="pelabel.js"></script>
<script src="sinkron.js"></script>
<script src="alur.js"></script>
</body>
</html>
