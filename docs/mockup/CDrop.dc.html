<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #CBA158; text-decoration: none; }
    a:hover { color: #e0bd7c; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0f1115;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f2f4f7;padding:64px 20px 24px;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px">
    <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#CBA158">Drop Note</div>
    <div style="font-size:12px;color:#6f757e">1.284 tersimpan</div>
  </div>

  <div style="background:#16181b;border:1px solid #262a31;border-radius:14px;padding:16px;min-height:120px">
    <div style="font-size:16px;line-height:1.5;color:#5c626b">Tempel atau tulis apa saja…</div>
  </div>

  <div style="height:18px"></div>

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px">
    <span style="font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#6f757e">Rak</span>
    <span style="font-size:12px;color:#5c626b">ketuk, jangan ketik</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
    <div style="height:46px;border-radius:11px;background:#CBA158;color:#20160a;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">apps design</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">dev link</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">prompt AI</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">balasan CS</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">keuangan</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">anak</div>
    <div style="height:46px;border-radius:11px;border:1px solid #262a31;color:#c8cdd4;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center">ide</div>
    <div style="height:46px;border-radius:11px;border:1px dashed #2f343c;color:#6f757e;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      lainnya
    </div>
  </div>

  <div style="height:9px"></div>
  <div style="font-size:12px;color:#5c626b">7 rak teratas — sisanya di "lainnya"</div>

  <div style="height:18px"></div>

  <div style="display:flex;gap:10px">
    <button style="flex:1;height:54px;border:none;border-radius:12px;background:#CBA158;color:#20160a;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg>
      Drop
    </button>
    <button style="flex:1;height:54px;border:1px solid #2f343c;border-radius:12px;background:transparent;color:#f2f4f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      Cari
    </button>
  </div>

  <div style="flex-grow:1"></div>

  <div style="font-size:12.5px;line-height:1.6;color:#5c626b;text-align:center">Rak yang sering dipakai naik sendiri.<br>Tidak ada yang perlu disusun.</div>
</div>
</x-dc>

</html>
