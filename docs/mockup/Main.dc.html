<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #CBA158; text-decoration: none; }
    a:hover { color: #e0bd7c; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0f1115;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f2f4f7;padding:64px 20px 24px;display:flex;flex-direction:column;gap:0;overflow:hidden">

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px">
    <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#CBA158">Drop Note</div>
    <div style="font-size:12px;color:#6f757e">1.284 tersimpan</div>
  </div>

  <div style="background:#16181b;border:1px solid #262a31;border-radius:14px;padding:16px;min-height:158px;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:16px;line-height:1.5;color:#5c626b">Tempel atau tulis apa saja…</div>
  </div>

  <div style="height:10px"></div>

  <div style="display:flex;align-items:center;gap:10px;background:#16181b;border:1px solid #262a31;border-radius:12px;padding:0 14px;height:50px">
    <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:16px;color:#CBA158">#</span>
    <span style="font-size:15px;color:#5c626b">kategori — boleh disingkat</span>
  </div>

  <div style="height:16px"></div>

  <div style="display:flex;gap:10px">
    <button style="flex:1;height:54px;border:none;border-radius:12px;background:#CBA158;color:#20160a;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg>
      Drop
    </button>
    <button style="flex:1;height:54px;border:1px solid #2f343c;border-radius:12px;background:transparent;color:#f2f4f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      Cari
    </button>
  </div>

  <div style="height:24px"></div>

  <div style="font-size:13px;line-height:1.6;color:#5c626b;text-align:center">Satu kotak untuk dua-duanya.<br>Isi lalu pilih tombolnya.</div>

  <div style="flex-grow:1"></div>

  <div style="display:flex;align-items:center;gap:8px;justify-content:center;color:#3f444b;font-size:12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
    tersimpan langsung, tanpa jaringan
  </div>
</div>
</x-dc>
</body>
</html>
